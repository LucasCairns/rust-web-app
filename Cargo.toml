[package]
edition = "2021"
name = "rust-web-app"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = {version = "0.8.8"}
axum-extra = {version = "0.12.5", features = ["typed-header"]}
dotenvy = "0.15"
http-body-util = "0.1.3"
hyper = {version = "1.8.1", features = ["full"]}
jsonwebtoken = "11.1.0"
once_cell = "1.19"
regex = "1.12"
reqwest = {version = "0.13.1", features = ["json"]}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
sqlx = {version = "0.9.0", features = ["migrate", "postgres", "runtime-tokio", "tls-rustls", "time", "uuid"]}
thiserror = "2.0.17"
time = {version = "0.3.46", features = ["serde", "serde-human-readable", "macros"]}
tokio = {version = "1.52.1", features = ["full"]}
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
utoipa = {version = "6.0.0", features = ["axum_extras", "uuid", "time"]}
utoipa-swagger-ui = {version = "10.0.2", features = ["axum"]}
uuid = {version = "1.20.0", features = ["serde", "v4"]}
validator = {version = "0.21.0", features = ["derive"]}
